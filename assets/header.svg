<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pham Xuan Truong — Full-Stack Developer">
  <title>Pham Xuan Truong — Full-Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.45"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .orb-a { animation: driftA 14s ease-in-out infinite alternate; }
      .orb-b { animation: driftB 18s ease-in-out infinite alternate; }
      .orb-c { animation: driftC 22s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(120px, 40px); } }
      @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-140px, -30px); } }
      @keyframes driftC { from { transform: translate(0, 0); } to { transform: translate(-60px, 50px); } }
      .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-700px); } to { transform: translateX(700px); } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .orb-a, .orb-b, .orb-c, .scan, .caret, .pulse { animation: none; }
        .rise { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="orb-a" cx="230" cy="70" r="260" fill="url(#orbA)"/>
    <circle class="orb-b" cx="1010" cy="250" r="280" fill="url(#orbB)"/>
    <circle class="orb-c" cx="760" cy="20" r="200" fill="url(#orbC)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#334155" stroke-opacity="0.6"/>
  </g>

  <g text-anchor="middle">
    <text class="mono rise d1" x="600" y="78" font-size="15" letter-spacing="4" fill="#94a3b8">HELLO, I'M</text>
    <text class="sans rise d2" x="600" y="146" font-size="66" font-weight="800" letter-spacing="-1" fill="url(#name)">Pham Xuan Truong</text>
    <text class="sans rise d3" x="600" y="190" font-size="22" font-weight="500" fill="#e2e8f0">Full-Stack Developer <tspan fill="#64748b">·</tspan> TypeScript <tspan fill="#64748b">·</tspan> NestJS <tspan fill="#64748b">·</tspan> React <tspan fill="#64748b">·</tspan> Python</text>
  </g>

  <g class="rise d3">
    <rect x="300" y="214" width="600" height="1.5" fill="#1e293b"/>
    <g clip-path="url(#card)"><rect class="scan" x="450" y="213.5" width="300" height="2.5" fill="url(#line)"/></g>
  </g>

  <g class="rise d4">
    <rect x="444" y="250" width="300" height="32" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
    <circle class="pulse" cx="464" cy="266" r="5" fill="#34d399"/>
    <text class="mono" x="479" y="271" font-size="14" fill="#cbd5e1">building products end-to-end<tspan class="caret" fill="#818cf8">_</tspan></text>
  </g>
</svg>
