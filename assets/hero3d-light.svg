<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Pham Xuan Truong — Full-Stack Developer">
  <title>Pham Xuan Truong — Full-Stack Developer</title>
  <defs>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#1f2328"/>
      <stop offset="0.42" stop-color="#1f2328"/>
      <stop offset="0.5" stop-color="#0969da"/>
      <stop offset="0.58" stop-color="#1f2328"/>
      <stop offset="1" stop-color="#1f2328"/>
      <animate attributeName="x1" values="-460;760;760" keyTimes="0;0.55;1" begin="1.2s" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-40;1180;1180" keyTimes="0;0.55;1" begin="1.2s" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .in { opacity: 0; animation: in 0.8s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.2s; } .d3 { animation-delay: 0.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .drop { opacity: 0; animation: drop 0.9s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes drop { from { opacity: 0; transform: translateY(-70px); } to { opacity: 1; transform: none; } }
    .float { animation: float 3.6s ease-in-out 1.8s infinite alternate; }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(var(--a)); } }
    .shadow { opacity: 0; animation: shadowIn 1s ease-out 0.4s forwards; }
    @keyframes shadowIn { to { opacity: 0.18; } }
    @media (prefers-reduced-motion: reduce) {
      .in, .drop, .shadow { animation: none; opacity: 1; }
      .float { animation: none; }
    }
  </style>

  <text class="mono in d1" x="40" y="104" font-size="14" font-weight="600" letter-spacing="3" fill="#0969da">FULL-STACK DEVELOPER</text>
  <text class="sans in d2" x="37" y="174" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#shine)">Pham Xuan Truong</text>
  <text class="sans in d3" x="40" y="216" font-size="20" fill="#59636e">Building web platforms end-to-end: APIs, web &amp; mobile apps, CI/CD.</text>

  <rect x="40" y="258" width="620" height="1" fill="#d1d9e0"/>
  <rect x="40" y="257" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" from="0" to="140" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
  </rect>
  <circle cx="180" cy="258.5" r="3" fill="#8250df" opacity="0">
    <animate attributeName="cx" values="180;660" begin="1.5s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
  </circle>

  <polygon class="shadow" points="975.0,174.0 1148.2,274.0 1052.9,329.0 879.7,229.0" fill="#1f2328" filter="url(#blur)"/>

  <g class="drop" style="animation-delay:0.35s">
    <g class="float" style="--a:0px">
      <polygon points="879.7,191.0 1052.9,291.0 1052.9,313.0 879.7,213.0" fill="#14b8a6"/>
      <polygon points="1148.2,236.0 1052.9,291.0 1052.9,313.0 1148.2,258.0" fill="#0f766e"/>
      <polygon points="975.0,136.0 1148.2,236.0 1052.9,291.0 879.7,191.0" fill="#99f6e4"/>
      <polygon points="975.0,136.0 1148.2,236.0 1052.9,291.0 879.7,191.0" fill="url(#gloss)"/>
      <polygon points="975.0,136.0 1148.2,236.0 1052.9,291.0 879.7,191.0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
      <text transform="matrix(0.8660 0.5 0 1 888.4 196.0)" y="15" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">DEVOPS<tspan font-weight="400" fill-opacity="0.85">  Docker · CI/CD</tspan></text>
      
    </g>
  </g>
  <g class="drop" style="animation-delay:0.51s">
    <g class="float" style="--a:-5px">
      <polygon points="879.7,157.0 1052.9,257.0 1052.9,279.0 879.7,179.0" fill="#0ea5e9"/>
      <polygon points="1148.2,202.0 1052.9,257.0 1052.9,279.0 1148.2,224.0" fill="#0369a1"/>
      <polygon points="975.0,102.0 1148.2,202.0 1052.9,257.0 879.7,157.0" fill="#7dd3fc"/>
      <polygon points="975.0,102.0 1148.2,202.0 1052.9,257.0 879.7,157.0" fill="url(#gloss)"/>
      <polygon points="975.0,102.0 1148.2,202.0 1052.9,257.0 879.7,157.0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
      <text transform="matrix(0.8660 0.5 0 1 888.4 162.0)" y="15" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">BACKEND<tspan font-weight="400" fill-opacity="0.85">  NestJS · PostgreSQL</tspan></text>
      
    </g>
  </g>
  <g class="drop" style="animation-delay:0.67s">
    <g class="float" style="--a:-10px">
      <polygon points="879.7,123.0 1052.9,223.0 1052.9,245.0 879.7,145.0" fill="#3b82f6"/>
      <polygon points="1148.2,168.0 1052.9,223.0 1052.9,245.0 1148.2,190.0" fill="#1d4ed8"/>
      <polygon points="975.0,68.0 1148.2,168.0 1052.9,223.0 879.7,123.0" fill="#93c5fd"/>
      <polygon points="975.0,68.0 1148.2,168.0 1052.9,223.0 879.7,123.0" fill="url(#gloss)"/>
      <polygon points="975.0,68.0 1148.2,168.0 1052.9,223.0 879.7,123.0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
      <text transform="matrix(0.8660 0.5 0 1 888.4 128.0)" y="15" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">FRONTEND<tspan font-weight="400" fill-opacity="0.85">  React · Next.js</tspan></text>
      
    </g>
  </g>
  <g class="drop" style="animation-delay:0.83s">
    <g class="float" style="--a:-15px">
      <polygon points="879.7,89.0 1052.9,189.0 1052.9,211.0 879.7,111.0" fill="#8b5cf6"/>
      <polygon points="1148.2,134.0 1052.9,189.0 1052.9,211.0 1148.2,156.0" fill="#6d28d9"/>
      <polygon points="975.0,34.0 1148.2,134.0 1052.9,189.0 879.7,89.0" fill="#c4b5fd"/>
      <polygon points="975.0,34.0 1148.2,134.0 1052.9,189.0 879.7,89.0" fill="url(#gloss)"/>
      <polygon points="975.0,34.0 1148.2,134.0 1052.9,189.0 879.7,89.0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
      <text transform="matrix(0.8660 0.5 0 1 888.4 94.0)" y="15" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">MOBILE<tspan font-weight="400" fill-opacity="0.85">  React Native</tspan></text>
      <text transform="matrix(0.8660 0.5 -0.8660 0.5 1014.0 111.5)" class="mono" font-size="30" font-weight="700" text-anchor="middle" y="10" fill="#4c1d95" fill-opacity="0.55">&lt;/&gt;</text>
    </g>
  </g>
</svg>
