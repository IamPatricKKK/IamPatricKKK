<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Pham Xuan Truong — Full-Stack Developer">
  <title>Pham Xuan Truong — Full-Stack Developer</title>
  <defs>
