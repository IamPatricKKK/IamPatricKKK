    <clipPath id="c0"><rect x="858" y="54" width="0" height="22"><animate attributeName="width" from="0" to="139" begin="1.00s" dur="0.33s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="882" y="82" width="0" height="22"><animate attributeName="width" from="0" to="299" begin="1.45s" dur="0.71s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="882" y="106" width="0" height="22"><animate attributeName="width" from="0" to="263" begin="2.28s" dur="0.63s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="882" y="130" width="0" height="22"><animate attributeName="width" from="0" to="235" begin="3.03s" dur="0.56s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="882" y="154" width="0" height="22"><animate attributeName="width" from="0" to="254" begin="3.71s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="858" y="178" width="0" height="22"><animate attributeName="width" from="0" to="22" begin="4.43s" dur="0.18s" fill="freeze"/></rect></clipPath>
