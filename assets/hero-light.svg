      <animate attributeName="x1" values="-460;760;760" keyTimes="0;0.55;1" begin="0.9s" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-40;1180;1180" keyTimes="0;0.55;1" begin="0.9s" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
