name: Update activity card

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Render activity SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity.py "${{ github.repository_owner }}" assets

      - name: Commit & push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/activity-light.svg assets/activity-dark.svg
          if git commit -m "Update activity card"; then
            git push
          fi
